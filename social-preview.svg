<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- Warm background -->
  <rect width="1280" height="640" fill="#FBFAF6"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none"/>
      <circle cx="20" cy="20" r="0.5" fill="#E0DDD5"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- Dark UI mockup rectangle -->
  <rect x="100" y="140" width="480" height="360" rx="12" fill="#1A1A2E"/>
  <rect x="100" y="140" width="480" height="360" rx="12" fill="none" stroke="#2D2D3D" stroke-width="1"/>

  <!-- UI content lines -->
  <rect x="130" y="175" width="120" height="8" rx="4" fill="#D67C64" opacity="0.9"/>
  <rect x="130" y="200" width="200" height="6" rx="3" fill="#3D3D4D"/>
  <rect x="130" y="220" width="160" height="6" rx="3" fill="#3D3D4D" opacity="0.7"/>
  <rect x="130" y="250" width="420" height="1" fill="#2D2D3D"/>

  <!-- Task sequence - checked items -->
  <circle cx="145" cy="280" r="8" fill="#4ECDC4" opacity="0.9"/>
  <rect x="160" y="276" width="100" height="6" rx="3" fill="#E0E0E0"/>
  <circle cx="145" cy="310" r="8" fill="#4ECDC4" opacity="0.9"/>
  <rect x="160" y="306" width="140" height="6" rx="3" fill="#E0E0E0"/>
  <circle cx="145" cy="340" r="8" fill="#3D3D4D"/>
  <rect x="160" y="336" width="120" height="6" rx="3" fill="#6D6D7D"/>
  <circle cx="145" cy="370" r="8" fill="#3D3D4D"/>
  <rect x="160" y="366" width="90" height="6" rx="3" fill="#6D6D7D"/>

  <!-- Cursor -->
  <path d="M440 290 L440 315 L447 309 L455 320 L458 318 L450 307 L458 307 Z" fill="#FFFFFF" opacity="0.9"/>

  <!-- Terracotta accent bar -->
  <rect x="700" y="140" width="4" height="360" rx="2" fill="#D67C64"/>

  <!-- Title text -->
  <text x="740" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#0F172A">How Anthropic</text>
  <text x="740" y="285" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#0F172A">Makes Videos</text>
  <text x="740" y="340" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#D67C64">That Get 78M</text>
  <text x="740" y="395" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#0F172A">Views.</text>

  <!-- Subtitle -->
  <text x="740" y="440" font-family="Inter, -apple-system, sans-serif" font-size="16" fill="#64748B">77 videos analyzed · 17-chapter methodology · 7 languages</text>

  <!-- Stats row -->
  <rect x="740" y="475" width="1" height="40" fill="#E0DDD5"/>
  <text x="765" y="493" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A">77</text>
  <text x="765" y="510" font-family="Inter, -apple-system, sans-serif" font-size="11" fill="#94A3B8">videos</text>

  <rect x="830" y="475" width="1" height="40" fill="#E0DDD5"/>
  <text x="855" y="493" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A">577M</text>
  <text x="855" y="510" font-family="Inter, -apple-system, sans-serif" font-size="11" fill="#94A3B8">total views</text>

  <rect x="940" y="475" width="1" height="40" fill="#E0DDD5"/>
  <text x="965" y="493" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A">18×</text>
  <text x="965" y="510" font-family="Inter, -apple-system, sans-serif" font-size="11" fill="#94A3B8">growth in 8mo</text>

  <!-- Bottom bar -->
  <rect x="0" y="620" width="1280" height="20" fill="#1A1A2E"/>
  <rect x="0" y="620" width="200" height="20" fill="#D67C64"/>
</svg>
